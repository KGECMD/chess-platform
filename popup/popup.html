<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">&#9822;</div>
      <h1>Chess Buddy</h1>
      <label class="toggle-main">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="section">
      <h2>Engine</h2>
      <div class="option-row">
        <label>Use Stockfish</label>
        <label class="toggle">
          <input type="checkbox" id="useStockfish" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="option-row">
        <label>Depth</label>
        <input type="range" id="engineDepth" min="8" max="24" value="18">
        <span id="depthVal">18</span>
      </div>
      <div class="option-row">
        <label>Lines</label>
        <input type="range" id="multiPv" min="1" max="3" value="1">
        <span id="pvVal">1</span>
      </div>
    </div>

    <div class="section">
      <h2>Display</h2>
      <div class="option-row">
        <label>Show Arrows</label>
        <label class="toggle">
          <input type="checkbox" id="showArrows" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="option-row">
        <label>Show Eval</label>
        <label class="toggle">
          <input type="checkbox" id="showEval" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <h2>Auto-Play</h2>
      <div class="option-row">
        <label>Auto Move</label>
        <label class="toggle">
          <input type="checkbox" id="autoMove">
          <span class="slider"></span>
        </label>
      </div>
      <div class="option-row">
        <label>Humanize</label>
        <label class="toggle">
          <input type="checkbox" id="humanize" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="option-row">
        <label>Min Delay (ms)</label>
        <input type="number" id="minDelay" value="800" min="200" max="5000" step="100">
      </div>
      <div class="option-row">
        <label>Max Delay (ms)</label>
        <input type="number" id="maxDelay" value="3500" min="500" max="10000" step="100">
      </div>
      <div class="option-row">
        <label>Strength %</label>
        <input type="range" id="strength" min="50" max="100" value="100">
        <span id="strengthVal">100</span>
      </div>
    </div>

    <div class="footer">
      <span class="status" id="status">Ready</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
